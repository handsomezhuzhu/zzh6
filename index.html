<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>visitor@fedora: ~</title>
  <meta name="description" content="handsomezhuzhu — terminal-style personal homepage" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2351a2da'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>z</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <div class="window" id="window">
      <div class="titlebar">
        <div class="dots">
          <button class="dot dot-close" id="btn-close" aria-label="close"></button>
          <button class="dot dot-min" id="btn-min" aria-label="minimize"></button>
          <button class="dot dot-max" id="btn-max" aria-label="maximize"></button>
        </div>
        <span class="titlebar-title">visitor@fedora: ~</span>
        <button class="theme-toggle" id="btn-theme" aria-label="toggle theme" title="Toggle theme (or run `theme`)">
          <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <div class="terminal" id="terminal">
        <div id="output"></div>
        <div class="input-line" id="input-line"><span class="prompt"><span class="p-bracket">[</span><span class="p-user">visitor</span><span class="p-at">@</span><span class="p-host">fedora</span> <span class="p-dir">~</span><span class="p-bracket">]</span><span class="p-dollar">$</span></span><span class="input-wrap"><span id="typed"></span><span class="cursor" id="cursor">&nbsp;</span><span id="ghost"></span><input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input" /></span></div>
      </div>
    </div>
    <p class="hint">type <code>help</code> to get started · <kbd>Tab</kbd> autocomplete · <kbd>↑↓</kbd> history</p>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
